      - name: Save latest tracker state
        run: |
          git config user.name "internship-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add internships_seen.json spring_weeks_seen.json

          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update tracker state"
            git push
          fi